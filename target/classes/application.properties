spring.application.name=vasscommerce-api

spring.datasource.url=jdbc:h2:mem:vasscommerce;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Parte 3.3 - selecao da implementacao de ProdutoModel via @Profile
# mem = ProdutoModelMemoria | sql = ProdutoModelSql (altere para trocar a implementacao)
spring.profiles.active=mem
